name: GC 리마인더

on:
  schedule:
    # 매주 월요일 오전 9시 (KST = UTC+9, 즉 UTC 00:00)
    - cron: '0 0 * * 1'
  workflow_dispatch: {}

jobs:
  weekly-gc:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Get week number
        id: week
        run: echo "week=$(date +'%Y-W%V')" >> $GITHUB_OUTPUT

      - name: Create weekly code GC issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = '${{ steps.date.outputs.date }}';
            const week = '${{ steps.week.outputs.week }}';
            const weekNum = new Date().getDate();

            // 매주: 코드 GC
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[GC] 코드 정리 ${week}`,
              labels: ['gc', 'automated'],
              body: `## GC 종류\n- [x] 코드 GC (매주)\n\n## 범위\n\`src/\` 전체\n\n## 수락 기준\n- [ ] 미사용 함수·변수·import 목록 제시\n- [ ] 중복 로직 목록 제시\n- [ ] 제거 가능 여부 판단 포함\n- [ ] 주석 처리된 코드 블록 목록\n- [ ] 30일 이상 된 TODO 주석 목록\n\n---\n*자동 생성: ${date}*`,
            });

            // 격주: 하네스 GC (짝수 주차)
            const weekNumber = parseInt(date.split('-')[1] || 0) || new Date(date).getWeek?.() || Math.ceil(parseInt(date.slice(8,10)) / 7);
            const isEvenWeek = (new Date(date).getTime() / (7 * 24 * 60 * 60 * 1000)) % 2 < 1;

            if (isEvenWeek) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[GC] 하네스 정리 ${date.slice(0,7)}`,
                labels: ['gc', 'automated'],
                body: `## GC 종류\n- [x] 하네스 GC (격주)\n\n## 범위\n\`harness/\`, \`skills/\`, \`memory/\` 전체\n\n## 수락 기준\n- [ ] 적용되지 않는 ai-rules 항목 목록\n- [ ] pre/post-hooks 중복 항목 목록\n- [ ] 사용되지 않는 skills/ 파일 목록\n- [ ] 이미 규칙화된 mistakes/ 항목 목록 (아카이브 대상)\n\n---\n*자동 생성: ${date}*`,
              });
            }
